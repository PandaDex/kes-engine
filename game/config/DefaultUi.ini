; UI settings for the game (engine/ui_system.h, UiConfig).
; Shipped next to the exe in config/ (kes_add_game CONFIG_DIR). Keys that are
; missing keep the engine defaults. F7 reloads this file in debug builds.
;
; Navigation bindings are input actions in config/default.imap: UI_Up, UI_Down,
; UI_Left, UI_Right, UI_Navigate, UI_Accept, UI_Back, UI_PrevTab, UI_NextTab,
; UI_Scroll. Actions the map leaves out get the engine defaults
; (kUiDefaultActionMap).

[UI]
; Font faces loaded at startup, comma-separated. The first is the fallback for
; glyphs missing from other fonts. Family "LatoLatin" is used by kes.rcss.
Fonts=engine/ui/fonts/LatoLatin-Regular.ttf, engine/ui/fonts/LatoLatin-Bold.ttf, engine/ui/fonts/LatoLatin-Italic.ttf, engine/ui/fonts/LatoLatin-BoldItalic.ttf
; Extra fallback faces (e.g. CJK or symbol fonts), comma-separated
FallbackFonts=
; Multiplies the window display scale for dp units
DensityScale=1.0

[Navigation]
; Input modes in which the UI_* actions drive the UI: UIOnly, GameAndUI or Never
GamepadNavigation=UIOnly
; Focus a control automatically when a menu has none: Gamepad (while the
; gamepad is the active device), Always or Never (only on the first input)
AutoFocus=Gamepad
; Return to a menu's last focused control when it is shown again
RememberFocus=True
HideCursorWithGamepad=True
; Held direction: seconds before the first repeat, then between repeats
RepeatDelay=0.40
RepeatInterval=0.11
; UI_Navigate stick tilt that counts as a press / a release
StickPressThreshold=0.50
StickReleaseThreshold=0.35
; UI_Scroll (right stick): deadzone, dp per second at full tilt
ScrollDeadzone=0.20
ScrollSpeed=900

[Sounds]
; Content paths, empty = silent
Focus=
Accept=
Back=
