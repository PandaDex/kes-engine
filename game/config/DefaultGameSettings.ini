; Project defaults for GameSettings (engine/game_settings.h).
; Shipped next to the exe in config/. The player's own settings are saved to
; <user config dir>/Config/GameSettings.ini and override these values.
; Anything not listed here falls back to AppConfig in game code.

[GameSettings]
ResolutionSizeX=1280
ResolutionSizeY=720
; Windowed, WindowedFullscreen or Fullscreen
FullscreenMode=Windowed
PreferredFullscreenMode=WindowedFullscreen
bUseVSync=True
; 0 = unlimited
FrameRateLimit=0
; Internal render resolution in percent of the window size (10-100)
ResolutionScale=100
; auto, vulkan or d3d11 (only used when the platform allows choosing)
PreferredRenderer=auto
; Look controls: multipliers on the player's base speeds (0.05-10)
MouseSensitivity=1.0
GamepadLookSensitivity=1.0
bInvertLookY=False
; Graphics quality: ShadowQuality 0 = off, 1 = low, 2 = medium, 3 = high;
; AntiAliasing = MSAA samples (1, 2, 4, 8); AnisotropicFiltering 1-16; ShadowDistance in meters
ShadowQuality=3
AntiAliasing=4
AnisotropicFiltering=8
ShadowDistance=60
